<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleeper</title>
  <meta name="description" content="A night train you watch from outside. Every journey is different: stations, tunnels, five landscapes and four weathers. Everything you see and hear is made by code.">
  <meta name="theme-color" content="#090b18">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Sleeper">
  <meta property="og:description" content="A night train you watch from outside. Every journey is different: stations, tunnels, five landscapes and four weathers. Everything you see and hear is made by code.">
  <meta property="og:url" content="https://bytiagodev.github.io/sleeper/">
  <meta property="og:image" content="https://bytiagodev.github.io/sleeper/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A sleeper train standing at a city station at night">
  <meta name="twitter:card" content="summary_large_image">

  <!-- The icon is written inline as a vector, so it needs no image file. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151a38'/%3E%3Ccircle cx='22.5' cy='9.5' r='4.5' fill='%23f2ead8'/%3E%3Crect x='3' y='18' width='26' height='9' rx='2.5' fill='%230a0b12'/%3E%3Crect x='6' y='20.5' width='4.5' height='4' fill='%23ffc76e'/%3E%3Crect x='13.75' y='20.5' width='4.5' height='4' fill='%23ffc76e'/%3E%3Crect x='21.5' y='20.5' width='4.5' height='4' fill='%23c98f4a'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" role="img" aria-label="A lit night train crossing a generated landscape"></canvas>
  <noscript><p class="noscript">Sleeper draws and plays everything with JavaScript, so it needs it turned on.</p></noscript>
  <div id="sleep-veil" class="sleep-veil" aria-hidden="true"></div>
  <div class="chrome">
    <div class="labels">
      <p id="journey-label" class="is-hidden" aria-live="polite"></p>
      <p id="station-label" class="is-hidden" aria-live="polite"></p>
    </div>
    <div class="buttons">
      <div id="sound-control" class="sound-control">
        <button id="sound-toggle" class="pill" type="button" aria-expanded="false" aria-controls="sound-panel">Sound: off</button>
        <div id="sound-panel" class="sound-panel">
          <div class="panel-row">
            <label class="panel-label" for="volume">Volume</label>
            <input id="volume" type="range" min="0" max="100" step="1" value="100">
          </div>
          <div class="panel-row" role="group" aria-labelledby="sleep-label">
            <span id="sleep-label" class="panel-label">Sleep</span>
            <div class="choices">
              <button type="button" data-sleep-minutes="0" aria-pressed="true">Off</button>
              <button type="button" data-sleep-minutes="15" aria-pressed="false" aria-label="15 minutes">15m</button>
              <button type="button" data-sleep-minutes="30" aria-pressed="false" aria-label="30 minutes">30m</button>
              <button type="button" data-sleep-minutes="60" aria-pressed="false" aria-label="1 hour">1h</button>
            </div>
            <p id="sleep-status" class="panel-note" aria-live="polite"></p>
          </div>
          <button id="sound-off" class="panel-quiet" type="button">Turn sound off</button>
        </div>
      </div>
      <button id="share" class="pill" type="button">Share</button>
      <button id="new-journey" class="pill" type="button">New journey</button>
    </div>
  </div>
  <!-- Plain scripts in order, not modules, so the page also runs when
       opened straight from disk. Later files use what earlier ones define. -->
  <script src="js/random.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/prerender.js"></script>
  <script src="js/journey.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/track.js"></script>
  <script src="js/biomes/city.js"></script>
  <script src="js/biomes/forest.js"></script>
  <script src="js/biomes/fields.js"></script>
  <script src="js/biomes/mountains.js"></script>
  <script src="js/biomes/coast.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/tunnels.js"></script>
  <script src="js/foreground.js"></script>
  <script src="js/biomes/builders.js"></script>
  <script src="js/train.js"></script>
  <script src="js/carriages.js"></script>
  <script src="js/passengers.js"></script>
  <script src="js/locomotive.js"></script>
  <script src="js/smoke.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/sleep.js"></script>
  <script src="js/controls.js"></script>
  <script src="main.js"></script>
</body>
</html>
